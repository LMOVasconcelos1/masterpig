<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="bTFcSkG8uiGgZ6ruaZQLatoAz7GH4eZAk1nRm6cd">

        <title>MasterPig</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.bunny.net">
        <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet" />

        <!-- Styles/Scripts (CDN fallback, independent of Vite) -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: {
                                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a', 950: '#172554',
                            }
                        }
                    }
                }
            }
        </script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                    <link rel="icon" href="/logo.png" type="image/png">
                <style>
            input[type="text"],
            input[type="password"],
            input[type="email"],
            input[type="number"],
            select,
            textarea {
                padding: 0.75rem 1rem;
                font-size: 1.0625rem;
                border-radius: 0.75rem;
                min-height: 2.75rem;
            }
        </style>
    </head>
    <body class="font-sans text-gray-900 antialiased">
        <div class="min-h-screen flex flex-col sm:justify-center items-center pt-6 sm:pt-0 bg-gradient-to-br from-primary-50 to-white">

            <div class="w-full sm:max-w-md mt-6 px-6 py-4 bg-white shadow-md overflow-hidden sm:rounded-lg">
                <div class="sm:max-w-lg w-full mx-auto">
        <div class="text-center mb-6">
                            <img src="/logoSemPalavra.png" alt="MasterPig" class="mx-auto w-40 h-40 object-contain transition-transform duration-300 hover:scale-105 drop-shadow" style="image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges;">
                        <div class="mt-3">
                <h1 class="text-xl font-bold text-gray-800">MasterPig</h1>
                <p class="text-sm text-gray-500">Acesso ao sistema de gestão suína</p>
            </div>
        </div>

        <div class="bg-white/90 backdrop-blur rounded-3xl shadow-lg border border-gray-100 p-6 transition-all duration-300 hover:shadow-xl hover:border-primary-200">
            
            <form id="login-form" method="POST" action="/login" class="space-y-4">
                <input type="hidden" name="_token" value="bTFcSkG8uiGgZ6ruaZQLatoAz7GH4eZAk1nRm6cd" autocomplete="off">
                <div>
                    <label for="cnpj" class="block text-sm font-medium text-gray-700">CNPJ</label>
                    <input id="cnpj" name="cnpj" type="text" inputmode="numeric" autocomplete="organization" value="" class="mt-1 block w-full rounded-2xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 transition-all duration-200 hover:border-primary-400" placeholder="00.000.000/0000-00">
                                    </div>

                <div>
                    <label for="usuario" class="block text-sm font-medium text-gray-700">Usuário</label>
                    <input id="usuario" name="usuario" type="text" value="" required autofocus class="mt-1 block w-full rounded-2xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 transition-all duration-200 hover:border-primary-400">
                                    </div>

                <div>
                    <label for="senha" class="block text-sm font-medium text-gray-700">Senha</label>
                    <input id="senha" name="senha" type="password" required autocomplete="current-password" class="mt-1 block w-full rounded-2xl border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 transition-all duration-200 hover:border-primary-400">
                                    </div>

                <div class="flex items-center justify-between pt-2">
                    <label for="remember_me" class="inline-flex items-center select-none">
                        <input id="remember_me" type="checkbox" class="rounded border-gray-300 text-primary-600 shadow-sm focus:ring-primary-500" name="remember">
                        <span class="ms-2 text-sm text-gray-600">Lembrar-me</span>
                    </label>
                </div>

                <div class="pt-2">
                    <button type="submit" class="inline-flex items-center justify-center w-full rounded-2xl border border-transparent shadow-sm px-4 py-2 bg-primary-600 text-sm font-semibold text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-transform duration-200 hover:scale-[1.02]">
                        <i class="fa-solid fa-right-to-bracket mr-2"></i>
                        Entrar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        (() => {
            const key = 'mp_cnpj';
            const input = document.getElementById('cnpj');
            const form = document.getElementById('login-form');
            if (!input || !form) return;

            const normalize = (v) => (v || '').toString().replace(/\D+/g, '');

            const cached = normalize(localStorage.getItem(key));
            if (!input.value && cached) input.value = cached;

            const persist = () => {
                localStorage.setItem(key, normalize(input.value));
            };

            input.addEventListener('input', persist);
            form.addEventListener('submit', persist);
        })();
    </script>
            </div>
        </div>
    </body>
</html>
